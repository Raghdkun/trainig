; PHP limits for the training app (PHP-FPM / CGI reads .user.ini from the
; directory of the running script — that's public/index.php).
;
; Media uploads are CHUNKED (see MediaUploadController) — every request carries
; only a single ~5 MB chunk, so these limits do NOT need to match the media
; ceiling (video is 500 MB, uploaded 5 MB at a time). They only need to clear
; one chunk plus form fields. Do NOT raise these to 500 MB — a single huge
; request is exactly what causes the FastCGI backend to die with a bare Apache
; "503 Service Unavailable". Keep post_max_size a touch above
; upload_max_filesize; the timeouts give slow connections room per chunk.
upload_max_filesize = 64M
post_max_size = 68M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
